<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - My Inventory System</title>
  
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/business_logo.png') }}">
  <link rel="preload" as="image" href="{{ url_for('static', filename='img/warehouse_live_bg.jpg') }}" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/amrapali-theme.css') }}">

  <style>
    :root {
      --font-google: 'Google Sans', 'Google Sans Text', 'Roboto', 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      font-family: var(--font-google) !important;
    }

    html {
      height: 100%;
      min-height: 100%;
    }

    /* Zoom-Proof & Refresh-Proof Body Base */
    body {
      font-family: var(--font-google) !important;
      background-color: #071738;
      background-image: url("{{ url_for('static', filename='img/warehouse_live_bg.jpg') }}");
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      margin: 0;
      padding: 24px 16px 28px;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       ZOOM-PROOF LIVE BACKGROUND LAYER (Animated Warehouse + Glass Ambient Atmosphere)
       ========================================================================== */
    .login-bg-scene {
      position: fixed;
      top: -6%;
      left: -6%;
      width: 112vw;
      height: 112vh;
      height: 112dvh;
      min-width: 112%;
      min-height: 112%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }

    .login-bg-image {
      position: absolute;
      top: -8%;
      left: -8%;
      width: 116%;
      height: 116%;
      background-image: url("{{ url_for('static', filename='img/warehouse_live_bg.jpg') }}");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      filter: brightness(0.92) contrast(1.08) saturate(1.18);
      animation: liveWarehouseMotion 30s ease-in-out infinite alternate;
      will-change: transform;
      transform-origin: center center;
    }

    @keyframes liveWarehouseMotion {
      0% {
        transform: scale(1.0) translate(0, 0);
      }
      35% {
        transform: scale(1.06) translate(-1.2%, -0.8%);
      }
      70% {
        transform: scale(1.04) translate(1.0%, -1.4%);
      }
      100% {
        transform: scale(1.07) translate(-0.6%, 0.6%);
      }
    }

    /* Ambient Contrast Overlay (Balanced so warehouse shines through without interfering) */
    .login-bg-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(6, 22, 54, 0.38) 0%, rgba(3, 14, 38, 0.62) 60%, rgba(2, 8, 22, 0.82) 100%),
        linear-gradient(180deg, rgba(3, 15, 42, 0.4) 0%, rgba(2, 9, 26, 0.65) 100%);
    }

    /* Ambient Pulsing Glow Orbs */
    .login-bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      pointer-events: none;
      animation: pulseAmbientGlow 14s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .glow-cyan {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(0, 166, 214, 0.4) 0%, transparent 70%);
      top: -100px;
      right: 5%;
      animation-delay: 0s;
    }

    .glow-navy {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(11, 61, 145, 0.5) 0%, transparent 70%);
      bottom: -100px;
      left: 5%;
      animation-delay: -5s;
    }

    .glow-teal {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.28) 0%, transparent 70%);
      top: 35%;
      left: -80px;
      animation-delay: -9s;
    }

    @keyframes pulseAmbientGlow {
      0% {
        transform: scale(0.92) translate(0, 0);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.15) translate(15px, -15px);
        opacity: 0.55;
      }
      100% {
        transform: scale(0.98) translate(-10px, 10px);
        opacity: 0.38;
      }
    }

    /* ==========================================================================
       LOGIN CONTAINER & TRUE FROSTED GLASS EFFECT
       ========================================================================== */
    .login-container {
      position: relative;
      z-index: 10;
      max-width: 440px;
      width: 100%;
      margin: auto; /* Vertically & horizontally centered, scrolls cleanly at any zoom level */
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-card {
      width: 100%;
      /* Authentic Frosted Glass Surface */
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow:
        0 25px 55px -10px rgba(0, 0, 0, 0.52),
        0 10px 20px -5px rgba(2, 20, 50, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.35) inset,
        0 2px 4px rgba(255, 255, 255, 0.8) inset;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-header {
      /* Translucent Glass Header */
      background: linear-gradient(135deg, rgba(11, 61, 145, 0.86) 0%, rgba(6, 31, 74, 0.92) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: #ffffff;
      padding: 20px 22px 17px;
      text-align: center;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .login-header-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .login-crest {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: contain;
      background: transparent;
      border: none;
      padding: 0;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      transition: transform 0.25s ease;
    }

    .login-crest:hover {
      transform: scale(1.05);
    }

    .login-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .login-body {
      padding: 20px 22px 24px;
    }

    /* Role Switcher Tabs */
    .role-toggle-group {
      display: flex;
      gap: 6px;
      background: rgba(240, 244, 250, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .role-toggle-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px 8px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .role-toggle-btn:hover {
      color: #0b3d91;
    }

    .role-toggle-btn.active.role-admin {
      background: rgba(255, 255, 255, 0.95);
      color: #0b3d91;
      box-shadow: 0 3px 10px rgba(11, 61, 145, 0.16);
      font-weight: 700;
      border-bottom: 2px solid #0b3d91;
    }

    .role-toggle-btn.active.role-member {
      background: rgba(255, 255, 255, 0.95);
      color: #15803d;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.16);
      font-weight: 700;
      border-bottom: 2px solid #16a34a;
    }

    /* Form Fields (Ultra-Crisp, High Contrast, Non-Interfering) */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 5px;
    }

    .form-label i {
      color: #0284c7;
      font-size: 13.5px;
    }

    .form-control {
      display: block;
      width: 100%;
      padding: 9.5px 13px;
      font-size: 13.5px;
      font-weight: 500;
      color: #0f172a !important;
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(200, 214, 229, 0.85);
      border-radius: 9px;
      transition: all 0.18s ease;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), inset 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .form-control::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .form-control:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25), 0 1px 3px rgba(15, 23, 42, 0.06);
      outline: none;
    }

    /* CAPTCHA Section */
    .captcha-badge-wrapper {
      display: flex;
      align-items: center;
      background: rgba(224, 242, 254, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid #7dd3fc;
      border-radius: 9px;
      padding: 2px 7px;
      flex-shrink: 0;
      user-select: none;
      box-shadow: 0 1px 2px rgba(2, 132, 199, 0.08);
    }

    #captcha-img {
      height: 36px;
      width: 110px;
      cursor: pointer;
      border-radius: 5px;
      display: block;
      transition: opacity 0.15s ease;
    }

    #captcha-img:hover {
      opacity: 0.85;
    }

    /* Buttons */
    .btn-submit {
      width: 100%;
      padding: 10.5px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 9px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 8px;
    }

    .btn-submit.btn-primary {
      background: linear-gradient(135deg, #0b3d91 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(11, 61, 145, 0.38);
    }

    .btn-submit.btn-primary:hover {
      background: linear-gradient(135deg, #093278 0%, #0274b0 100%);
      box-shadow: 0 6px 18px rgba(11, 61, 145, 0.48);
      transform: translateY(-1px);
    }

    .btn-submit.btn-success {
      background: linear-gradient(135deg, #15803d 0%, #16a34a 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.38);
    }

    .btn-submit.btn-success:hover {
      background: linear-gradient(135deg, #166534 0%, #15803d 100%);
      box-shadow: 0 6px 18px rgba(22, 163, 74, 0.48);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Separator */
    .login-separator {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0 12px;
    }

    .login-separator::before,
    .login-separator::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid rgba(203, 213, 225, 0.85);
    }

    .login-separator span {
      padding: 0 10px;
      font-size: 11.5px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
    }

    /* Google Sign-in Button */
    .btn-google-signin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      border-radius: 9px;
      color: #334155;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      cursor: pointer;
    }

    .btn-google-signin:hover {
      background: #ffffff;
      border-color: #94a3b8;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
      color: #0f172a;
      transform: translateY(-1px);
    }

    /* ==========================================================================
       STATUS BADGE PILL (Pulsating Green Indicator Light + Glass Finish)
       ========================================================================== */
    .login-footer-pill {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 7px 18px;
      background: rgba(7, 24, 60, 0.68);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 9999px;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      user-select: none;
    }

    .live-dot-pulse {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 10px;
      height: 10px;
    }

    .live-dot-core {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      z-index: 2;
    }

    .live-dot-ring {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.45);
      animation: radarPulse 1.8s ease-out infinite;
      z-index: 1;
    }

    @keyframes radarPulse {
      0% {
        transform: scale(0.4);
        opacity: 0.95;
      }
      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    #btn-toggle-password:hover {
      color: #0b3d91 !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px 24px;
      }
      .login-card {
        border-radius: 16px;
      }
      .login-body {
        padding: 18px 16px 20px;
      }
      .login-footer-pill {
        font-size: 11px;
        padding: 6px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Zoom-Proof Live Animated Background Layer (Warehouse Logistics Theme) -->
  <div class="login-bg-scene" aria-hidden="true">
    <div class="login-bg-image"></div>
    <div class="login-bg-overlay"></div>
    <div class="login-bg-glow glow-cyan"></div>
    <div class="login-bg-glow glow-navy"></div>
    <div class="login-bg-glow glow-teal"></div>
  </div>

  <!-- Login Card Box (Frosted Glass Container) -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-header-logos">
          <img src="{{ url_for('static', filename='img/business_logo.png') }}" alt="Inventory Management System" class="login-crest">
        </div>
        <h2 class="login-title">Inventory Management Portal</h2>
      </div>

      <div class="login-body">
        <!-- Flash messages (Errors / Warnings / Info) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="badge badge-{{ category }}" style="display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 10px 12px; font-size: 13px; border-radius: 9px; margin-bottom: 16px; text-align: left; line-height: 1.4;">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 14px; margin-top: 1px;"></i>
                <span>{{ message }}</span>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Role Selector Tabs -->
        <div class="role-toggle-group">
          <button type="button" class="role-toggle-btn role-admin {% if active_role == 'Admin' %}active{% endif %}" id="tab-admin" onclick="switchRole('Admin')">
            <i class="bi bi-shield-lock-fill"></i> Admin Login
          </button>
          <button type="button" class="role-toggle-btn role-member {% if active_role == 'Member' %}active{% endif %}" id="tab-member" onclick="switchRole('Member')">
            <i class="bi bi-person-badge-fill"></i> Member Login
          </button>
        </div>

        <!-- Login Form -->
        <form action="{{ url_for('login') }}" method="POST">
          <input type="hidden" name="role_hint" id="role_hint" value="{{ active_role }}">

          <div class="form-group">
            <label class="form-label" id="username-label">
              <i class="bi {% if active_role == 'Admin' %}bi-shield-person{% else %}bi-person-badge{% endif %}" id="label-icon"></i>
              <span id="label-role-text">{% if active_role == 'Admin' %}Admin User ID{% else %}Member User ID{% endif %}</span>
            </label>
            <input type="text" name="username" id="input-username" class="form-control" placeholder="{% if active_role == 'Admin' %}Enter Admin User ID{% else %}Enter Member User ID{% endif %}" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label"><i class="bi bi-key"></i> Password</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" name="password" id="input-password" class="form-control" placeholder="Enter Password" required style="padding-right: 42px;">
              <button type="button" id="btn-toggle-password" onclick="togglePasswordVisibility()" title="Show/Hide Password" style="position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: none; border: none; cursor: pointer; color: #64748b; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: color 0.15s ease;">
                <i class="bi bi-eye" id="icon-toggle-password"></i>
              </button>
            </div>
          </div>

          <!-- Security CAPTCHA Verification -->
          <div class="form-group">
            <label class="form-label"><i class="bi bi-shield-check"></i> Security Code (CAPTCHA) *</label>
            <div style="display: flex; gap: 10px; align-items: center;">
              <div class="captcha-badge-wrapper">
                <img id="captcha-img" src="{{ url_for('get_captcha') }}" alt="CAPTCHA Code" onclick="refreshCaptcha()" title="Click image to refresh security code">
                <button type="button" onclick="refreshCaptcha()" title="Refresh Security Code" style="background: none; border: none; color: #0284c7; cursor: pointer; padding: 4px 6px; font-size: 16px;">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
              </div>
              <input type="text" name="captcha" id="input-captcha" class="form-control" placeholder="ENTER CODE" maxlength="6" autocomplete="off" style="text-transform: uppercase; font-family: var(--font-google) !important; font-size: 14.5px; font-weight: 700; letter-spacing: 2px;" required>
            </div>
          </div>

          <button type="submit" class="btn btn-submit {% if active_role == 'Admin' %}btn-primary{% else %}btn-success{% endif %}" id="btn-submit">
            <i class="bi {% if active_role == 'Admin' %}bi-shield-lock-fill{% else %}bi-person-check-fill{% endif %}" id="btn-icon"></i>
            <span id="btn-text">{% if active_role == 'Admin' %}Sign In to Admin Portal{% else %}Sign In to Member Portal{% endif %}</span>
          </button>
        </form>

        <!-- Google / Gmail Sign-In Option -->
        <div class="login-separator">
          <span>or sign in with</span>
        </div>

        <a href="{{ url_for('login_google') }}" class="btn-google-signin">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          <span>Continue with Google (Gmail)</span>
        </a>
      </div>
    </div>

    <!-- Status Badge Pill with Pulsating Green Indicator Light -->
    <div class="login-footer-pill" id="live-status-pill">
      <span class="live-dot-pulse">
        <span class="live-dot-ring"></span>
        <span class="live-dot-core"></span>
      </span>
      <span>Enterprise Inventory System &bull; ISO 9001 Live Node</span>
    </div>
  </div>

  <script>
    function switchRole(role) {
      document.getElementById('role_hint').value = role;
      const btnSubmit = document.getElementById('btn-submit');
      const btnIcon = document.getElementById('btn-icon');
      const btnText = document.getElementById('btn-text');
      const labelText = document.getElementById('label-role-text');
      const labelIcon = document.getElementById('label-icon');
      const inputUser = document.getElementById('input-username');
      const tabAdmin = document.getElementById('tab-admin');
      const tabMember = document.getElementById('tab-member');

      if (role === 'Admin') {
        tabAdmin.classList.add('active');
        tabMember.classList.remove('active');
        labelIcon.className = 'bi bi-shield-person';
        labelText.textContent = 'Admin User ID';
        inputUser.placeholder = 'Enter Admin User ID';
        btnSubmit.className = 'btn btn-submit btn-primary';
        btnIcon.className = 'bi bi-shield-lock-fill';
        btnText.textContent = 'Sign In to Admin Portal';
      } else {
        tabMember.classList.add('active');
        tabAdmin.classList.remove('active');
        labelIcon.className = 'bi bi-person-badge';
        labelText.textContent = 'Member User ID';
        inputUser.placeholder = 'Enter Member User ID';
        btnSubmit.className = 'btn btn-submit btn-success';
        btnIcon.className = 'bi bi-person-check-fill';
        btnText.textContent = 'Sign In to Member Portal';
      }
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('input-password');
      const pwdIcon = document.getElementById('icon-toggle-password');
      if (pwdInput && pwdIcon) {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          pwdIcon.className = 'bi bi-eye-slash-fill';
          pwdIcon.style.color = '#0b3d91';
        } else {
          pwdInput.type = 'password';
          pwdIcon.className = 'bi bi-eye';
          pwdIcon.style.color = '';
        }
      }
    }

    function refreshCaptcha() {
      const img = document.getElementById('captcha-img');
      if (img) {
        img.src = "{{ url_for('get_captcha') }}?t=" + new Date().getTime();
        const inp = document.getElementById('input-captcha');
        if (inp) {
          inp.value = '';
          inp.focus();
        }
      }
    }
  </script>
</body>
</html>
